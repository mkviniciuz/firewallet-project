<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="style.css" type="text/css">
    <meta charset="UTF-8" />
    <title>Firewallet</title>
  </head>
  <body>
    <div id="main-content">
      <img src="assets/img/login-logo.png" draggable="false" style="user-select: none; margin-bottom: -100px;">
      <main>
        <p style="font-weight: 200; font-size: 12px;">Entre em sua conta <b style="font-weight: 800;">Firewallet©</b></bold></p>
        <form id="login-form" onsubmit="event.preventDefault(); enviarLogin();" style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
          <input id="cpf" type="text" maxlength="14" placeholder="CPF">
          <input id="password" type="password" maxlength="6" placeholder="Senha">
          <a><p style="font-weight: 200; font-size: 12px; margin-right: 80px;">Recuperar meu acesso ></p></a>
          <button id="login-button" type="submit">ENTRAR</button>
        </form>
      </main>
      
      <footer>
        <h3 style="font-size: 10px; margin-bottom: 0px;">Firewallet©</h3>
        <p style="font-size: 10px; font-weight: 400; opacity: 0.3;margin-bottom: -15px;">Desenvolvido por V²</p>
      </footer>
    </div>

    <div id="panel-dashboard" style="display: none;">
      <img src="assets/img/app-icon.png" draggable="false"  style="user-select: none; margin: 15px; position: absolute;left: 0px;" width="40px">
      <span id="balance-section">
        <p style="font-weight: 200; font-size: 12px;">Saldo atual</p>
        <h2 id="balance-value">5.023</h2>
        <span id="balance-type">
          <p id="corrente-type">Corrente</p>
          <p id="poupanca-type">Poupança</p>
        </span>

      </span>

    </div>

  </body>
  <script>
  const cpfInput = document.getElementById("cpf");

  cpfInput.addEventListener("beforeinput", (e) => {
    if (e.data && !/^\d$/.test(e.data)) {
      e.preventDefault();
    }
  });

  cpfInput.addEventListener("input", () => {
    let v = cpfInput.value.replace(/\D/g, "");

    v = v.substring(0, 11);
    if (v.length > 9) {
      v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
    } else if (v.length > 6) {
      v = v.replace(/(\d{3})(\d{3})(\d+)/, "$1.$2.$3");
    } else if (v.length > 3) {
      v = v.replace(/(\d{3})(\d+)/, "$1.$2");
    }

    cpfInput.value = v;
  });
</script>
<script>
  async function enviarLogin() {
    const cpf = document.getElementById("cpf").value.replace(/\D/g, "");
    const senha = document.getElementById("password").value;

    const resposta = await window.api.login(cpf, senha);
    const balance = await window.api.buscarSaldo(cpf)

    console.log(resposta);
    console.log(balance);

    if (resposta.ok) {
      document.getElementById("main-content").style.display = 'none';
      document.getElementById("panel-dashboard").style.display = 'flex';
      document.getElementById("balance-value").innerText = balance.saldo;
    } else {
        alert("Erro: " + resposta.msg);
    }
}
</script>
<script>
    async function carregarSaldo() {
      const cpf = document.getElementById("cpf").value.replace(/\D/g, "");

      const resposta = await window.api.buscarSaldo(cpf);

      console.log(resposta);

      if (resposta.ok) {
        document.getElementById("balance-value").innerText = resposta.saldo;

      } else {
          alert("Erro: " + resposta.msg);
      }

  };
</script>
</html>
