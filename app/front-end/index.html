<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="style.css" type="text/css">
    <meta charset="UTF-8" />
    <title>Firewallet</title>
  </head>
  <body>
    <div id="register-panel" style="display: none;">
      <img src="assets/img/login-logo.png" draggable="false" style="user-select: none; margin-bottom: -50px;">
      <h2 id="register-title">Crie sua conta <strong>Firewallet©</strong></h2>
      <form action="#" method="POST">
            <div class="input-group">
                <input type="text" name="nome" placeholder="Nome completo" required>
            </div>

            <div class="input-group">
                <input type="text" id="cpf-register" name="cpf" placeholder="CPF" maxlength="14" required>
            </div>

            <div class="input-group">
                <input type="text" name="nascimento" placeholder="Data de nascimento" onfocus="(this.type='date')" onblur="(if(!this.value)this.type='text')" required>
            </div>

            <div class="input-group">
                <input type="email" name="email" placeholder="E-mail" required>
            </div>

            <div class="input-group">
                <input type="tel" id="celular" name="celular" placeholder="Celular" maxlength="15" required>
            </div>

            <div class="input-group">
                <input type="password" name="senha" placeholder="Senha" minlength="6" maxlength="6" required>
            </div>

            <button type="submit" class="btn-submit">CADASTRAR</button>
        </form>
        <div class="footer-links">
            <a href="#" onclick="alreadyhaveaccount()">Já tenho uma conta. Entrar.</a>
            <div class="footer-brand">
                Firewallet©<br>
                Desenvolvido por V²
            </div>
        </div>
    </div>

    <div id="main-content">
      <img src="assets/img/login-logo.png" draggable="false" style="user-select: none; margin-bottom: -100px;">
      <main>
        <p style="font-weight: 200; font-size: 12px;">Entre em sua conta <b style="font-weight: 800;">Firewallet©</b></bold></p>
        <form id="login-form" onsubmit="event.preventDefault(); enviarLogin();" style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
          <input id="cpf" type="text" maxlength="14" placeholder="CPF">
          <input id="password" type="password" maxlength="6" placeholder="Senha">
          <a><p style="font-weight: 200; font-size: 12px; margin-right: 80px;" onclick="createaccount()">Criar uma conta Firewallet ></p></a>
          <button id="login-button" type="submit">ENTRAR</button>
        </form>
      </main>
      
      <footer>
        <h3 style="font-size: 10px; margin-bottom: 0px;">Firewallet©</h3>
        <p style="font-size: 10px; font-weight: 400; opacity: 0.3;margin-bottom: -15px;">Desenvolvido por V²</p>
      </footer>
    </div>

    <div id="panel-dashboard" style="display: none;">
      <img src="assets/img/app-icon.png" draggable="false"  style="user-select: none; margin: 15px; position: absolute;left: 0px;" width="40px">
      <span id="balance-section">
        <p style="font-weight: 200; font-size: 12px;">Saldo atual</p>
        <h2 id="balance-value" style="margin-top: 25px;">5.023</h2>
        <span id="balance-type">
          <p id="corrente-type">Corrente</p>
          <p id="poupanca-type">Poupança</p>
        </span>

      </span>

    </div>

  </body>
  <script>
  const cpfInput = document.getElementById("cpf");

  cpfInput.addEventListener("beforeinput", (e) => {
    if (e.data && !/^\d$/.test(e.data)) {
      e.preventDefault();
    }
  });

  cpfInput.addEventListener("input", () => {
    let v = cpfInput.value.replace(/\D/g, "");

    v = v.substring(0, 11);
    if (v.length > 9) {
      v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
    } else if (v.length > 6) {
      v = v.replace(/(\d{3})(\d{3})(\d+)/, "$1.$2.$3");
    } else if (v.length > 3) {
      v = v.replace(/(\d{3})(\d+)/, "$1.$2");
    }

    cpfInput.value = v;
  });
</script>
<script>
  async function enviarLogin() {
    const cpf = document.getElementById("cpf").value.replace(/\D/g, "");
    const senha = document.getElementById("password").value;

    const resposta = await window.api.login(cpf, senha);
    const balance = await window.api.buscarSaldo(cpf)

    console.log(resposta);
    console.log(balance);

    if (resposta.ok) {
      document.getElementById("main-content").style.display = 'none';
      document.getElementById("panel-dashboard").style.display = 'flex';
      document.getElementById("balance-value").innerText = balance.saldo;
    } else {
        alert("Erro: " + resposta.msg);
    }
}
</script>
<script>
    async function carregarSaldo() {
      const cpf = document.getElementById("cpf").value.replace(/\D/g, "");

      const resposta = await window.api.buscarSaldo(cpf);

      console.log(resposta);

      if (resposta.ok) {
        document.getElementById("balance-value").innerText = resposta.saldo;

      } else {
          alert("Erro: " + resposta.msg);
      }

  };
</script>
<script>
        // Máscara para CPF
        document.getElementById('cpf-register').addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, "");
            value = value.replace(/(\d{3})(\d)/, "$1.$2");
            value = value.replace(/(\d{3})(\d)/, "$1.$2");
            value = value.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
            e.target.value = value;
        });

        // Máscara para Celular
        document.getElementById('celular').addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, "");
            value = value.replace(/^(\d{2})(\d)/g, "($1) $2");
            value = value.replace(/(\d)(\d{4})$/, "$1-$2");
            e.target.value = value;
        });
</script>
<script>
  function alreadyhaveaccount() {
    document.getElementById('main-content').style.display = 'flex';
    document.getElementById('register-panel').style.display = 'none';
  }

  function createaccount() {
    document.getElementById('main-content').style.display = 'none';
    document.getElementById('register-panel').style.display = 'flex';
  }
</script>
</html>
