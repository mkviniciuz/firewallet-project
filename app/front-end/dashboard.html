<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="style.css" type="text/css">
    <meta charset="UTF-8" />
    <title>Firewallet</title>
  </head>
<body>
    <h2 id="valor-saldo">R$ --,--</h2>

</body>
<script>
    async function carregarSaldo() {
        const display = document.getElementById('valor-saldo');
        
        // Chama a API exposta pelo preload.js
        const resposta = await window.api.buscarSaldo(1);

        if (resposta.erro) {
            display.innerText = "Erro";
            display.style.color = "red";
        } else {
            // Formata para Euro ou Real conforme a sua preferência
            const valor = resposta.saldo.toLocaleString('pt-BR', { 
                style: 'currency', 
                currency: 'BRL' 
            });
            display.innerText = valor;
            display.style.color = "green";
        }
    }

    // --- AQUI ESTÁ A ALTERAÇÃO ---
    // Isto diz ao navegador: "Assim que o HTML estiver lido, executa esta função"
    document.addEventListener('DOMContentLoaded', () => {
        carregarSaldo();
    });

</script>
</html>
