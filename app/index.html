<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="style.css" type="text/css">
    <meta charset="UTF-8" />
    <title>Firewallet</title>
  </head>
  <body>
    <div id="main-content">
      <img src="login-logo.png" draggable="false" style="user-select: none; margin-bottom: -100px;">
      <main>
        <p style="font-weight: 200; font-size: 12px;">Entre em sua conta <b style="font-weight: 800;">Firewallet©</b></bold></p>
         <input id="cpf" type="text" maxlength="14" placeholder="CPF">
         <input id="password" type="password" maxlength="14" placeholder="Senha">
      </main>
      <a><p style="font-weight: 200; font-size: 12px; float: left; margin-left: 80px;">Recuperar meu acesso ></p></a>
      <footer>
        <h3 style="font-size: 10px; margin-bottom: 0px;">Firewallet©</h3>
        <p style="font-size: 10px; font-weight: 400; opacity: 0.3;margin-top: 0px;">Desenvolvido por V²</p>
      </footer>
    </div>

  </body>
  <script>
  const cpfInput = document.getElementById("cpf");

  cpfInput.addEventListener("beforeinput", (e) => {
    if (e.data && !/^\d$/.test(e.data)) {
      e.preventDefault();
    }
  });

  cpfInput.addEventListener("input", () => {
    let v = cpfInput.value.replace(/\D/g, "");

    v = v.substring(0, 11);
    if (v.length > 9) {
      v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
    } else if (v.length > 6) {
      v = v.replace(/(\d{3})(\d{3})(\d+)/, "$1.$2.$3");
    } else if (v.length > 3) {
      v = v.replace(/(\d{3})(\d+)/, "$1.$2");
    }

    cpfInput.value = v;
  });
</script>
</html>
